# =============================================================================
# The secure transport: joining the server's authority, and speaking TLS to it.
# =============================================================================
# `server_transport` (packages/server.yaml) chooses between http (none of this runs), prefer-https and https; what each
# does is in core/secure_wake.h. While the owner has yet to approve the display, the panel shows the code to type in at
# the server.
# The parts: core/join.h (joining), core/secure_wake.h (the choices), tls/stream.h (TLS and the body) and
# esp/secure_chip.h (the chip's flash, clock and watchdog), all but the last tested against a real server (tests/tls/).
substitutions:
  # The owner's root built into the firmware, as base64 of its DER (`openssl x509 -in root.pem -outform der | base64 -w0`),
  # for an owner who would rather not rely on the pairing code for the first contact: nothing is then fetched, and a server
  # that shows another root is refused. Left empty, the root is fetched and confirmed by the code.
  server_root: ""

globals:
  # The pairing code is on the panel as a notice, because the owner has to type it in at the server. Kept across sleep so it
  # is drawn once, not every wake. Cleared whenever the picture or another notice is drawn over it.
  - id: prompt_on_panel
    type: bool
    restore_value: yes
    initial_value: 'false'

script:
  # Holding KEY0 for ten seconds at the start of a wake resets the pairing (core/hold.h): at five the panel says to keep
  # holding, and letting go before ten leaves everything as it was. The wake waits here while the button is down, so it is
  # run before anything has used the identity (the boot sequence in reterminal-e1003.yaml). Only for a display that pairs.
  - id: reset_gate
    then:
      - lambda: 'home_display_state::reset_hold.begin(millis(), home_display_button::key0_down());'
      - while:
          condition:
            lambda: 'return home_display_state::reset_hold.active();'
          then:
            - lambda: 'home_display_state::hold_action = home_display_state::reset_hold.update(millis(), home_display_button::key0_down());'
            - if:
                condition:
                  lambda: 'return home_display_state::hold_action == home_display_hold::Action::WARN;'
                then:
                  - lambda: |-
                      id(notice_text) = home_display_hold::warning_notice();
                      id(show_notice) = true;
                      id(notice_on_panel) = true;
                      id(prompt_on_panel) = false;
                  - component.update: eink_display
            - if:
                condition:
                  lambda: 'return home_display_state::hold_action == home_display_hold::Action::RESET;'
                then:
                  - lambda: |-
                      const bool erased = home_display_secure_chip::erase_pairing();
                      ESP_LOGW("reset", "Pairing %s", erased ? "erased" : "NOT erased");
                      id(notice_text) = home_display_hold::done_notice(erased);
                      id(show_notice) = true;
                      id(notice_on_panel) = true;
                      id(prompt_on_panel) = false;
                  - component.update: eink_display
                  - delay: ${eink_refresh_settle}
            - delay: 100ms

  # The start of a wake's dealings with the server: plain, or after joining.
  - id: begin_server
    then:
      - if:
          condition:
            lambda: 'return home_display_service::transport_from("${server_transport}") != home_display_service::Transport::HTTP;'
          then:
            - script.execute: secure_session
          else:
            - script.execute: check_plan

  # A display that prefers HTTPS leaves it alone while it remembers that the server it found has none (core/no_https.h): plain
  # HTTP at once, with no wait for the clock, no search for an HTTPS port that is not there, and no failure to report.
  - id: secure_session
    then:
      - if:
          condition:
            lambda: |-
              return home_display_secure_wake::leaves_https_alone(home_display_service::transport_from("${server_transport}"),
                                                                  home_display_no_https::remembers()) &&
                     id(server_ip) != 0;
          then:
            - logger.log: "The server has no HTTPS (remembered): plain HTTP, and not looking again yet"
            - script.execute: check_plan
          else:
            - script.execute: secure_attempt

  # Gets the clock, finds the server, joins if need be, and goes on by the route core/secure_wake.h chooses.
  - id: secure_attempt
    then:
      - script.execute: ensure_clock
      - if:
          condition:
            lambda: 'return id(server_ip) == 0 || id(server_tls_port) == 0;'
          then:
            - script.execute: discover
      - lambda: |-
          constexpr auto transport = home_display_service::transport_from("${server_transport}");
          // What the display says it is when it asks to join (core/profile.h): the owner sees it before approving.
          const home_display_profile::Profile profile{"${device_model}", ESPHOME_PROJECT_VERSION,
                                                      ${image_width},    ${image_height},
                                                      ${grey_levels},    home_display_profile::formats_from_accept("${accept_formats}")};
          const auto begun = home_display_secure_chip::begin(transport, id(server_ip), id(server_tls_port), App.get_name().str(),
                                                     id(shown_version), "${server_root}", profile);
          home_display_state::route = begun.verdict.route;
          home_display_state::secure_failure = begun.verdict.failure;
          home_display_state::prompt_wanted = begun.verdict.prompt;
          home_display_state::prompt_text = begun.prompt;
          home_display_state::wait_retry_s = begun.retry_after_s;
          if (begun.verdict.failure != home_display_report::Failure::NONE)
            ESP_LOGW("secure", "Not secure: %s", home_display_report::failure_label(begun.verdict.failure));
      - if:
          condition:
            lambda: 'return home_display_state::route == home_display_secure_wake::Route::SECURE;'
          then:
            - script.execute: use_tls
            - script.execute: check_plan
          else:
            - if:
                condition:
                  lambda: 'return home_display_state::route == home_display_secure_wake::Route::WAIT_FOR_OWNER;'
                then:
                  - script.execute: wait_for_owner
                else:
                  - if:
                      condition:
                        lambda: 'return home_display_state::route == home_display_secure_wake::Route::FAIL;'
                      then:
                        - lambda: 'home_display_state::fail_reason = home_display_state::secure_failure;'
                        - script.execute: give_up
                      else:
                        # Plain HTTP: the transport prefers HTTPS and it did not work out. The server hears why at the next wake
                        # that gets through.
                        - lambda: |-
                            if (home_display_state::secure_failure != home_display_report::Failure::NONE)
                              home_display_telemetry::set_failure(home_display_state::secure_failure);
                        - script.execute: check_plan

  # This wake speaks TLS: the picture comes through esp/secure_http.h.
  - id: use_tls
    then:
      - lambda: |-
          home_display_state::secure_active = true;
          id(dashboard).set_parent(&home_display_secure::http());

  # Back to the stock component and plain HTTP, for the rest of this wake.
  - id: use_plain_http
    then:
      - lambda: |-
          ESP_LOGW("secure", "Falling back to plain HTTP");
          home_display_telemetry::set_failure(home_display_state::fail_reason);
          home_display_state::secure_active = false;
          id(dashboard).set_parent(id(stock_http));

  # The pairing code in the corner, for the owner to type in at the server.
  - id: show_prompt
    then:
      - lambda: |-
          id(notice_text) = home_display_state::prompt_text;
          id(show_notice) = true;
          id(notice_on_panel) = true;
          id(prompt_on_panel) = true;
      - component.update: eink_display
      - delay: ${eink_refresh_settle}

  # https only, and nothing can be done until the owner approves the display: show the code, and sleep for as long as the server
  # said before asking again. Not a failure, so it does not count towards the backoff and the owner is not kept waiting.
  - id: wait_for_owner
    then:
      - script.stop: wake_watchdog
      - lambda: |-
          home_display_telemetry::set_failure(home_display_state::secure_failure);
          id(plan_sleep_ms) = home_display_secure_wake::wait_sleep_ms(home_display_state::wait_retry_s);
          id(plan_received_ms) = 0;  // not the plan's sleep, so not shortened by the time the wake took
          ESP_LOGI("secure", "Waiting for the owner to approve this display; asking again in %u s",
                   (unsigned) (id(plan_sleep_ms) / 1000));
      - if:
          condition:
            lambda: 'return !id(prompt_on_panel);'
          then:
            - script.execute: show_prompt
      - script.execute: sleep_now
