# CodeQL's configuration, read by .github/workflows/codeql.yml.
name: home-display CodeQL configuration

# The default queries and the extra security ones (lower precision, more findings). Not the "quality" queries, which are about style and
# would be noise here.
queries:
  - uses: security-extended

# What is not analysed: the tests and their data, the examples, and what the build makes. (Tests written inside a source file, in a
# #[cfg(test)] module, cannot be left out by path: an alert there is dismissed with the reason "used in tests".)
paths-ignore:
  - "**/tests/**"
  - "**/tests.rs"
  - examples
  - testdata
  - target
  - esphome/.esphome
  - esphome/build
  - .venv
