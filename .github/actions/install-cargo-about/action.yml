name: install-cargo-about
description: >
  Installs cargo-about, which lists the licences of the crates a program is built from, at a fixed version and checked against the
  checksum its release published. Change both together to update it (Dependabot does not know about this one).

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        version=0.9.2
        sha256=9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
        file="cargo-about-${version}-x86_64-unknown-linux-musl.tar.gz"
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$file" \
          "https://github.com/EmbarkStudios/cargo-about/releases/download/${version}/${file}"
        echo "${sha256}  $RUNNER_TEMP/$file" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/cargo-about-${version}-x86_64-unknown-linux-musl/cargo-about" /usr/local/bin/cargo-about
        cargo about --version
