# =============================================================================
# The ESP32-S3 board: framework, PSRAM, logging, over-the-air updates and Wi-Fi.
# =============================================================================
substitutions:
  # What the display says it is when it asks to join (core/profile.h): the owner sees it before approving. The model of this
  # board; plain letters, digits, spaces and . _ - : +, at most 32.
  device_model: "reTerminal E1003"

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf
    advanced:
      # Lets lwIP's resolver look up .local names (ESPHome's own mDNS only advertises).
      # Some versions default it off to save flash, so set it explicitly.
      enable_lwip_mdns_queries: true
    # What the secure transport needs of mbedTLS: TLS 1.3 (off by default here) and the key-material exporter that the
    # RFC 9266 channel binding is made from. Client session tickets are already on.
    sdkconfig_options:
      # ESPHome turns this off to save RAM, and TLS 1.3 depends on it: the peer's certificates stay in memory for the
      # connection (about two certificates, 1 KB each, of heap while connected).
      CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_MBEDTLS_SSL_KEYING_MATERIAL_EXPORT: "y"

# OPI PSRAM holds the decoded image and the 16-level framebuffer.
psram:
  mode: octal

# The CH340K USB bridge is on UART0, not the default USB_CDC.
logger:
  hardware_uart: UART0

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  # No power saving while the radio is on. With the default (light sleep between the access point's beacons) a ping to the
  # display took 92 to 595 ms, 318 on average; without it, 3 to 11 ms, 6 on average. It did not make a picture download any
  # faster (that is the radio link and the decoder), and it draws more current whenever the radio is on, which includes the
  # time the panel spends drawing. The radio is off the rest of the time (`enable_on_boot` below). What it costs the battery
  # has not been measured.
  power_save_mode: none
  # Off until `start_wake` turns it on, so the battery is read with the radio idle (its transmit bursts
  # pull the cell down) and a flat battery never starts it at all.
  enable_on_boot: false
