name: release-please

on:
  push:
    branches: [main]

# Two merges close together would otherwise race to make the same release, and the second must not cancel the first.
concurrency:
  group: release-please
  cancel-in-progress: false

# Read-only unless a job asks for more: the jobs that call other workflows only read, and the ones that write ask for it themselves.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # release-please makes the release (a draft) and the changelog commit
      pull-requests: write # and opens and updates the release pull requests
    outputs:
      # For the server (the "." package) only: the firmware's are `esphome--release_created` and the like.
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      firmware_release_created: ${{ steps.release.outputs.esphome--release_created }}
      firmware_tag_name: ${{ steps.release.outputs.esphome--tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # Releases are made as drafts (`"draft": true` in the release-please configuration) and published by the jobs below, at the end,
  # because the repository's releases are immutable: once published, a release's tag is locked and its files can neither be added
  # to nor changed. So nothing is public until everything has passed and been attached, and a run that fails leaves a draft: fix
  # it, "Re-run failed jobs" (they use the same outputs, so the same draft and version), and it is published then.
  #
  # The checks (ci.yml), on the commit about to be released. Release-please makes the draft as soon as its pull request is merged,
  # whatever CI says, so this is what stops it being published from a failing commit.
  verify:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/ci.yml

  # The same for a release of the firmware: it builds (firmware.yml), so one that does not is seen here, and not when someone
  # next compiles that tag. It makes no file to attach: the firmware has the owner's Wi-Fi password compiled in, so a
  # release is the source at its tag (esphome/README.md, "To use a release").
  verify-firmware:
    needs: release-please
    if: ${{ needs.release-please.outputs.firmware_release_created == 'true' }}
    uses: ./.github/workflows/firmware.yml

  # Publishes the firmware's draft once it has built. Nothing to attach, so this is all there is.
  publish-firmware:
    needs: [release-please, verify-firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # to publish the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.firmware_tag_name }}
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  # That the packages install, and that the service starts from them (packages.yml), on this commit.
  verify-packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/packages.yml

  # Here and not in a workflow of its own that listens for `release: published`: a release made with the workflow's
  # token does not start other workflows, so that one would never run.
  build-server:
    needs: [release-please, verify, verify-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # to attach the files to the release, and publish it
      id-token: write # for the signing certificate of the attestation below
      attestations: write # to keep it
      artifact-metadata: write # and the record of what it is for
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 5
      # AVX2, FMA and BMI2 (x86-64-v3): every Intel Core since 2013 and AMD since 2017 has them, and so does the N305 this
      # runs on, but some low-end Pentium, Celeron and old Atom chips don't, and on those the binary dies with "illegal
      # instruction" on start. So the archive is named for the level and is not a build for any x86-64 machine. Only the
      # release has it: CI builds and tests the baseline.
      RUSTFLAGS: -C target-cpu=x86-64-v3
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the release was made at, which is the one just pushed.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A release build shares nothing with the dev profile that CI caches, so it has a key of its own. Saved, so the
          # next release recompiles little more than this program.
          shared-key: release
      - name: Build
        run: cargo build --release --locked --features otel --bin home-display-server --bin displayctl
      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh
      - uses: ./.github/actions/install-cargo-about
      # Before the archive and the packages, which carry what it makes. Stops the release if a crate has a licence that is not on
      # the list in about.toml.
      - name: Licences of what the program contains
        run: bash .github/scripts/third-party-licences.sh
      - name: Package
        run: bash .github/scripts/package-release.sh "$VERSION"
      - uses: ./.github/actions/install-nfpm
      - name: Packages
        run: bash .github/scripts/build-packages.sh "$VERSION"
      - name: Summary
        run: |
          {
            echo "### ${TAG}"
            echo '```'
            cat dist/*.sha256
            du -h dist/*.tar.gz dist/*.deb dist/*.rpm
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # A signed statement, kept by GitHub, that each of these files was built by this repository's workflow at this commit (SLSA build
      # provenance), which `gh attestation verify FILE` checks. It goes with the files as built here, before they are attached. It is
      # not one of the release's files, so the lock on those does not touch it. The release's own statement (immutable releases) says
      # what the release holds; this says how each file was made.
      - name: Attest the files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      # To the draft, by its tag: --clobber so that a re-run of this job replaces what a failed one attached.
      - name: Attach to the release
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sha256 --clobber
      # Last, and only if everything before it passed. From here the release is immutable: its tag is locked to this commit and its
      # files cannot be changed or removed.
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
