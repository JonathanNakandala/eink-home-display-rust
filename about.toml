# The licences of what the server is built from, for THIRD_PARTY_LICENSES.txt (cargo-about; .github/scripts/third-party-licences.sh).
# Most of them ask that their notice goes with every copy of the program, so a release carries the file.

# Only what the Linux program contains: the Windows and macOS crates in Cargo.lock are not in it, and neither are the build tools
# (headless_chrome's code generator, auto_generate_cdp, is GPL-3.0 and runs at build time only: nothing of it is in the program)
# or the test tools.
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# What the program may contain. A crate with a licence that is not here stops the build, so a new dependency's licence is looked at
# by a person before it is shipped. For a crate that offers a choice (MIT OR GPL-3.0), any one listed is enough.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
