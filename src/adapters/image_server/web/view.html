<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Home display</title>
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Display">
<link rel="manifest" href="/view/manifest.webmanifest">
<link rel="icon" href="/view/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/view/icons/180.png">
<style>
  :root { --bar: #f2f2f2; --ink: #111; --muted: #555; --warn: #8a4b00; --edge: #ccc; }
  @media (prefers-color-scheme: dark) {
    :root { --bar: #1c1c1c; --ink: #eee; --muted: #aaa; --warn: #f0b060; --edge: #333; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: Canvas; color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px;
           background: var(--bar); border-bottom: 1px solid var(--edge); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--edge);
               border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--ink); color: var(--bar); border-color: var(--ink); }
  nav button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  #status { margin-left: auto; color: var(--muted); }
  #status.problem { color: var(--warn); font-weight: 600; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
  main img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; border: 1px solid var(--edge); }
  #empty { color: var(--muted); }
  #signin { max-width: 36em; margin: auto; padding: 16px; text-align: left; }
  #signin h2 { margin-top: 0; font-size: 17px; }
  #signin code { background: var(--bar); padding: 1px 5px; border-radius: 4px; }
  #awake { font: inherit; color: inherit; background: transparent; border: 1px solid var(--edge); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  #awake[aria-pressed="true"] { background: var(--ink); color: var(--bar); border-color: var(--ink); }
  #signout { font: inherit; color: var(--muted); background: transparent; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
  body.kiosk header { display: none; }
  body.kiosk main { padding: 0; cursor: none; }
  body.kiosk main img { width: 100%; height: 100%; border: 0; }
  body.kiosk #problem { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 4px 10px;
                        background: var(--bar); color: var(--warn); font-weight: 600; }
  #problem:empty { display: none; }
</style>
</head>
<body>
<header>
  <h1>Home display</h1>
  <nav id="layouts" aria-label="Layout"></nav>
  <span id="status" role="status" aria-live="polite">Loading…</span>
  <button id="awake" type="button" aria-pressed="false" title="Stop the screen from sleeping while this page is showing" hidden>Keep screen on</button>
  <button id="signout" type="button" hidden>Sign out</button>
</header>
<main>
  <img id="picture" alt="What the display shows" hidden>
  <p id="empty" hidden>Nothing has been drawn yet.</p>
  <section id="signin" hidden>
    <h2 id="signin-title">This page needs a link from its owner</h2>
    <p id="signin-text">Ask for one, then open it in this browser. The owner makes it with <code>displayctl viewer create</code>.</p>
  </section>
</main>
<p id="problem" role="alert"></p>
<script>
(function () {
  'use strict';
  var API = '/view/api/';
  var picture = document.getElementById('picture');
  var empty = document.getElementById('empty');
  var statusLine = document.getElementById('status');
  var problem = document.getElementById('problem');
  var nav = document.getElementById('layouts');
  var layouts = [];
  var chosen = 'auto';
  var shown = null;      // the layout and version the picture is of
  var shownAt = null;    // when that render was made
  var timer = null;
  var failures = 0;
  var objectUrl = null;
  var signin = document.getElementById('signin');
  var signout = document.getElementById('signout');
  var TOKEN_KEY = 'hd.token';
  var REFRESH_KEY = 'hd.refresh';
  var EXPIRES_KEY = 'hd.expires';
  var GRANT = 'urn:ietf:params:oauth:grant-type:pre-authorized_code';
  var memory = {};          // where tokens are kept if the browser will not keep them
  var stopped = false;      // signed out: nothing to ask for until a link is opened
  var ended = false;        // a refresh token was refused: this browser's access has ended
  var lastFingerprint = null;   // what the last state said, so that a stream saying the same needs no look
  var streamAbort = null;       // the open stream of changes, if any
  var streamLive = false;       // a stream is open and has been heard from
  var streamFailures = 0;

  var params = new URLSearchParams(location.search);
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  var kiosk = hash.has('kiosk') || params.has('kiosk');
  // A page that is not to be changed by a touch: no choosing of layouts by button, swipe or key. For a wall.
  var locked = hash.has('lock') || params.has('lock');
  if (kiosk) document.body.classList.add('kiosk');
  try { chosen = params.get('layout') || localStorage.getItem('layout') || 'auto'; } catch (e) { chosen = params.get('layout') || 'auto'; }

  function stored(key) {
    try { return localStorage.getItem(key) || memory[key] || null; } catch (e) { return memory[key] || null; }
  }

  function token() { return stored(TOKEN_KEY); }
  function refreshToken() { return stored(REFRESH_KEY); }

  // Keeps what a token answer gave, or (with nothing) forgets it all. A viewer that refreshes is given a refresh token and a
  // short-lived access token, and the time that runs out is kept to renew it before then.
  function keep(access, refresh, expiresIn) {
    var values = {};
    values[TOKEN_KEY] = access || null;
    values[REFRESH_KEY] = access ? (refresh || null) : null;
    values[EXPIRES_KEY] = access && refresh && expiresIn ? String(Date.now() + expiresIn * 1000) : null;
    Object.keys(values).forEach(function (key) {
      memory[key] = values[key];
      try {
        if (values[key]) localStorage.setItem(key, values[key]); else localStorage.removeItem(key);
      } catch (e) { /* kept in memory only; fine */ }
    });
    signout.hidden = !access;
  }

  function send(path, options) {
    options = Object.assign({}, options);
    options.cache = 'no-store';
    options.headers = Object.assign({}, options.headers);
    var held = token();
    if (held) options.headers.Authorization = 'Bearer ' + held;
    return fetch(API + path, options);
  }

  // Trades the refresh token for a new pair, once, however many tabs ask at the same moment: a refresh token works once, and
  // asking twice with it is how a copy of one looks. Within the lock the storage is read again, in case another tab renewed
  // while this one waited. True if there is a good access token now, false if the viewer's access has ended, null if the
  // server could not be reached (nothing is forgotten, and it is tried again).
  async function renew() {
    var before = token();
    var run = async function () {
      var current = refreshToken();
      if (!current) return false;
      if (token() !== before) return true;
      var body = new URLSearchParams();
      body.set('grant_type', 'refresh_token');
      body.set('refresh_token', current);
      try {
        var response = await fetch(API + 'token', {
          method: 'POST', cache: 'no-store',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' },
          body: body.toString()
        });
        if (response.ok) {
          var answer = await response.json();
          keep(answer.access_token, answer.refresh_token, answer.expires_in);
          return true;
        }
        if (response.status === 400) { keep(null); ended = true; return false; }
        return null;
      } catch (e) {
        return null;
      }
    };
    if (navigator.locks && navigator.locks.request) return navigator.locks.request('hd.refresh', run);
    return run();
  }

  // Every request to the API shows the token, as a bearer token and in no other way (never in an address). An access token
  // that is about to run out is renewed first, and one that has been refused is renewed once and the request made again.
  async function api(path, options) {
    var expires = Number(stored(EXPIRES_KEY));
    if (refreshToken() && expires && expires - Date.now() < 60000) await renew();
    var response = await send(path, options);
    if (response.status === 401 && refreshToken()) {
      var renewed = await renew();
      if (renewed) response = await send(path, options);
    }
    return response;
  }

  function get(path) {
    return api(path, { headers: { Accept: 'application/json' } });
  }

  function needSignIn(title, text) {
    stopped = true;
    clearTimeout(timer);
    closeStream();
    forgetPicture();
    picture.hidden = true; empty.hidden = true; nav.textContent = '';
    document.getElementById('signin-title').textContent = title;
    document.getElementById('signin-text').textContent = text;
    signin.hidden = false;
    say('Not signed in', true);
    problem.textContent = '';
  }

  // Trades the one-time code from the link for a token, once, and takes the code out of the address.
  async function signIn(code) {
    var rest = new URLSearchParams(location.hash.replace(/^#/, ''));
    rest.delete('code');
    var url = new URL(location.href);
    url.hash = rest.toString();
    history.replaceState(null, '', url);
    var body = new URLSearchParams();
    body.set('grant_type', GRANT);
    body.set('pre-authorized_code', code);
    try {
      var response = await fetch(API + 'token', {
        method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' },
        body: body.toString()
      });
      if (response.ok) {
        var answer = await response.json();
        keep(answer.access_token, answer.refresh_token, answer.expires_in);
        stopped = false;
        ended = false;
        signin.hidden = true;
        return true;
      }
      if (response.status === 429) {
        needSignIn('Too many tries', 'Wait a few minutes, then open the link again if it still works.');
      } else {
        needSignIn('This link does not work', 'It may have been used already, or have run out. Ask the owner for a new one.');
      }
    } catch (e) {
      needSignIn('Cannot reach the server', 'Check the connection, then open the link again if it has not run out.');
    }
    return false;
  }

  async function leave() {
    var held = refreshToken() || token();
    keep(null);
    forgetPicture();
    needSignIn('Signed out', 'This browser no longer has access. Open a new link from the owner to look again.');
    if (held) {
      try {
        await fetch(API + 'revoke', {
          method: 'POST', cache: 'no-store',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'token=' + encodeURIComponent(held)
        });
      } catch (e) { /* the token is gone from here either way */ }
    }
  }

  function say(text, isProblem) {
    statusLine.textContent = text;
    statusLine.className = isProblem ? 'problem' : '';
  }

  function ago(seconds) {
    if (seconds < 60) return 'less than a minute ago';
    var m = Math.round(seconds / 60);
    if (m < 90) return m + ' min ago';
    var h = Math.round(m / 60);
    return h + ' h ago';
  }

  function renderNav() {
    nav.textContent = '';
    if (layouts.length < 2 || locked) return;
    var all = [{ name: 'auto', description: 'Whatever the schedule says now' }].concat(layouts);
    all.forEach(function (layout) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = layout.name === 'auto' ? 'Auto' : layout.name;
      b.title = layout.description;
      b.setAttribute('aria-pressed', String(layout.name === chosen));
      b.addEventListener('click', function () { choose(layout.name); });
      nav.appendChild(b);
    });
  }

  function choose(name) {
    chosen = name;
    try { localStorage.setItem('layout', name); } catch (e) { /* not kept; fine */ }
    var url = new URL(location.href);
    url.searchParams.set('layout', name);
    history.replaceState(null, '', url);
    renderNav();
    lastFingerprint = null;
    closeStream();
    refresh();
  }

  function cycle(step) {
    if (layouts.length < 2 || locked) return;
    var names = ['auto'].concat(layouts.map(function (l) { return l.name; }));
    var i = names.indexOf(chosen);
    choose(names[(i + step + names.length) % names.length]);
  }

  function schedule(seconds) {
    clearTimeout(timer);
    timer = setTimeout(refresh, Math.max(2, Math.min(seconds, 3600)) * 1000);
  }

  async function showPicture(state) {
    var key = state.layout + ':' + state.version;
    if (shown === key) return;
    var response = await api('image?layout=' + encodeURIComponent(state.layout));
    if (!response.ok) throw new Error('The picture could not be fetched (' + response.status + ')');
    var blob = await response.blob();
    var url = URL.createObjectURL(blob);
    picture.onload = function () { if (objectUrl && objectUrl !== url) URL.revokeObjectURL(objectUrl); objectUrl = url; };
    picture.src = url;
    picture.hidden = false;
    empty.hidden = true;
    shown = key;
    remember(blob, state);
  }

  // The last picture seen, kept in the browser (IndexedDB) so that a page that is reloaded, or opened with the network down, has
  // something to show at once and says how old it is. It is the viewer's own picture on its own device, and is forgotten when
  // it signs out or its access ends.
  function openDatabase() {
    return new Promise(function (resolve, reject) {
      var request = indexedDB.open('hd', 1);
      request.onupgradeneeded = function () { request.result.createObjectStore('last'); };
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error); };
    });
  }

  async function remember(blob, state) {
    try {
      var database = await openDatabase();
      await new Promise(function (resolve, reject) {
        var transaction = database.transaction('last', 'readwrite');
        transaction.objectStore('last').put({
          blob: blob,
          layout: state.layout,
          version: state.version,
          renderedAt: Date.now() - state.age_seconds * 1000
        }, 'picture:' + chosen);
        transaction.oncomplete = resolve;
        transaction.onerror = function () { reject(transaction.error); };
      });
      database.close();
    } catch (e) { /* nothing kept; the picture is still on screen */ }
  }

  async function showRemembered() {
    try {
      var database = await openDatabase();
      var found = await new Promise(function (resolve, reject) {
        var request = database.transaction('last').objectStore('last').get('picture:' + chosen);
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error); };
      });
      database.close();
      if (!found || picture.src) return;
      var url = URL.createObjectURL(found.blob);
      picture.onload = function () { objectUrl = url; };
      picture.src = url;
      picture.hidden = false;
      empty.hidden = true;
      shown = found.layout + ':' + found.version;
      shownAt = found.renderedAt;
      say(found.layout + ': updated ' + ago((Date.now() - shownAt) / 1000) + ' (checking)', false);
    } catch (e) { /* none, or not readable: the first look will do */ }
  }

  function forgetPicture() {
    try { indexedDB.deleteDatabase('hd'); } catch (e) { /* nothing to forget */ }
  }

  function fingerprint(state) {
    return [state.layout, state.version, state.stale, state.pending].join(':');
  }

  // A stream of changes from the server: it says when a render has finished or the layout on Auto has changed, so that the
  // picture is on screen a moment after it is drawn and the page need not ask on a timer. It is read with fetch, as a browser's
  // EventSource can't show a token. It is ended by the server every minute or so and opened again at once; if it can't be had,
  // the page carries on asking as before.
  function closeStream() {
    if (streamAbort) { streamAbort.abort(); streamAbort = null; }
    streamLive = false;
  }

  function heard(block) {
    var name = null, data = null;
    block.split('\n').forEach(function (line) {
      if (line.indexOf('event: ') === 0) name = line.slice(7);
      else if (line.indexOf('data: ') === 0) data = line.slice(6);
    });
    if (name !== 'state' || data === null) return;
    var said;
    try { said = JSON.parse(data); } catch (e) { return; }
    if (fingerprint(said) !== lastFingerprint) refresh();
  }

  async function openStream() {
    if (streamAbort || stopped || document.hidden || !window.ReadableStream) return;
    var controller = new AbortController();
    streamAbort = controller;
    var delay = 500;
    try {
      var response = await api('events?layout=' + encodeURIComponent(chosen), {
        signal: controller.signal, headers: { Accept: 'text/event-stream' }
      });
      if (unauthorised(response)) return;
      if (!response.ok || !response.body) throw new Error('no stream (' + response.status + ')');
      streamLive = true;
      streamFailures = 0;
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        var blocks = buffer.split('\n\n');
        buffer = blocks.pop();
        blocks.forEach(heard);
      }
    } catch (e) {
      if (controller.signal.aborted) return;
      streamFailures += 1;
      delay = Math.min(30000, 2000 * Math.pow(2, streamFailures - 1));
    }
    streamLive = false;
    if (streamAbort === controller) {
      streamAbort = null;
      setTimeout(openStream, delay);
    }
  }

  function describe(state) {
    shownAt = Date.now() - state.age_seconds * 1000;
    var text = (state.layout ? state.layout + ': ' : '') + 'updated ' + ago(state.age_seconds);
    if (state.stale) { say(text + ' (the server has not refreshed it when it should)', true); problem.textContent = 'Out of date: ' + ago(state.age_seconds); }
    else { say(text, false); problem.textContent = ''; }
  }

  // A token that is missing or no good ends the asking until the owner's link is opened.
  function unauthorised(response) {
    if (response.status !== 401) return false;
    if (token() || ended) {
      keep(null);
      needSignIn('This browser\'s access has ended', 'The owner may have revoked it, or it has run out. Ask for a new link.');
    } else {
      needSignIn('This page needs a link from its owner', 'Ask for one, then open it in this browser. The owner makes it with displayctl viewer create.');
    }
    return true;
  }

  async function refresh() {
    clearTimeout(timer);
    if (stopped) return;
    try {
      var listing = await get('layouts');
      if (unauthorised(listing)) return;
      if (listing.status === 429) { schedule(Number(listing.headers.get('Retry-After')) || 60); say('Too many requests; waiting', true); return; }
      if (!listing.ok) throw new Error('The layouts could not be listed (' + listing.status + ')');
      var data = await listing.json();
      var before = JSON.stringify(layouts);
      layouts = data.layouts;
      if (JSON.stringify(layouts) !== before) renderNav();
      if (chosen !== 'auto' && !layouts.some(function (l) { return l.name === chosen; })) chosen = 'auto';
      var response = await get('state?layout=' + encodeURIComponent(chosen));
      if (unauthorised(response)) return;
      if (response.status === 404) {
        picture.hidden = true; empty.hidden = false; shown = null;
        say('Waiting for the first picture', false); problem.textContent = '';
        failures = 0; schedule(15); return;
      }
      if (!response.ok) throw new Error('The server answered ' + response.status);
      var state = await response.json();
      await showPicture(state);
      describe(state);
      lastFingerprint = fingerprint(state);
      failures = 0;
      // Back when the server says the next picture is due (a moment after it is drawn, and every moment until it is, if it is
      // not there yet); and, on Auto, when the schedule changes the layout, so that the change is on screen when it happens.
      var next = state.next_seconds + 1;
      if (chosen === 'auto' && typeof state.auto_changes_in_seconds === 'number') {
        next = Math.min(next, state.auto_changes_in_seconds + 1);
      }
      // With a stream open the server says when to look, so asking is only for the age and for a stream that has quietly stopped.
      schedule(streamLive ? Math.max(next, 120) : next);
      openStream();
    } catch (e) {
      failures += 1;
      var wait = Math.min(300, 10 * Math.pow(2, failures - 1));
      // What is on screen stays, and says how old it is.
      var old = shownAt === null ? '' : ' Showing the picture from ' + ago((Date.now() - shownAt) / 1000) + '.';
      say('Cannot reach the server; trying again in ' + wait + ' s.' + old, true);
      problem.textContent = '';
      schedule(wait);
    }
  }

  // The age on screen moves on between refreshes.
  setInterval(function () {
    if (shownAt === null || statusLine.className === 'problem') return;
    var text = statusLine.textContent.replace(/updated .*$/, 'updated ' + ago((Date.now() - shownAt) / 1000));
    if (text !== statusLine.textContent) statusLine.textContent = text;
  }, 30000);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) closeStream(); else refresh();
  });
  window.addEventListener('online', refresh);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') cycle(1);
    else if (e.key === 'ArrowLeft') cycle(-1);
  });
  var touchX = null;
  document.addEventListener('touchstart', function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 80) cycle(dx < 0 ? 1 : -1);
  }, { passive: true });

  // Keeping the screen from sleeping, for a page that is to stay on a wall. It needs a secure page (HTTPS, or this very
  // machine), so where the browser has none of it the button is not offered. The browser lets it go whenever the page is hidden,
  // so it is asked for again whenever the page is shown.
  var awakeButton = document.getElementById('awake');
  var sentinel = null;
  var wantAwake = false;

  async function holdScreen() {
    if (!wantAwake || sentinel || document.hidden) return;
    try {
      sentinel = await navigator.wakeLock.request('screen');
      sentinel.addEventListener('release', function () { sentinel = null; });
    } catch (e) { sentinel = null; /* refused (low battery, say): it is asked for again next time */ }
  }

  function keepAwake(on, remember) {
    wantAwake = on;
    awakeButton.setAttribute('aria-pressed', String(on));
    if (remember) { try { localStorage.setItem('awake', on ? '1' : '0'); } catch (e) { /* not kept */ } }
    if (on) holdScreen(); else if (sentinel) { sentinel.release(); sentinel = null; }
  }

  if ('wakeLock' in navigator) {
    awakeButton.hidden = false;
    awakeButton.addEventListener('click', function () { keepAwake(!wantAwake, true); });
    document.addEventListener('visibilitychange', holdScreen);
    var remembered = null;
    try { remembered = localStorage.getItem('awake'); } catch (e) { /* none */ }
    // A page set up as a kiosk is for a wall: awake, unless it was told not to be.
    if (remembered === '1' || (kiosk && remembered !== '0')) keepAwake(true, false);
  }

  signout.addEventListener('click', leave);
  window.addEventListener('hashchange', function () {
    var code = new URLSearchParams(location.hash.replace(/^#/, '')).get('code');
    if (code) signIn(code).then(function (ok) { if (ok) refresh(); });
  });

  // The shell is kept by a service worker (where the browser has them, which is on a secure page) so that the page opens with
  // the network down. It keeps nothing private: the picture is kept above, by the page.
  if ('serviceWorker' in navigator && !params.has('nosw')) {
    navigator.serviceWorker.register('/view/sw.js', { scope: '/view' }).catch(function () { /* the page works without */ });
  }

  signout.hidden = !token();
  var code = hash.get('code');
  if (code) signIn(code).then(function (ok) { if (ok) refresh(); });
  else showRemembered().then(refresh);
})();
</script>
</body>
</html>
