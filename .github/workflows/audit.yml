name: audit

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/audit.yml
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/audit.yml
  # An advisory is published about a crate that has not changed, so the dependencies are looked at weekly as well, on the default
  # branch. A failure is an email to the owner.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Known vulnerabilities and unmaintained crates in Cargo.lock, and that every crate comes from crates.io (deny.toml, which says what is
  # ignored and why). The licences are cargo-about's, in licences.yml.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories sources
