    <style>
        @font-face {
            font-family: 'Overpass';
            font-weight: 300;
            src: url('fonts/Overpass/Overpass-Light.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Overpass';
            font-weight: 600;
            src: url('fonts/Overpass/Overpass-SemiBold.ttf') format('truetype');
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Overpass', sans-serif;
            font-weight: 300;
            color: #000;
            background: #fff;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas: 'header' 'main';
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            padding: 10px 16px;
        }

        /* The weather column only exists when weather is enabled; departures take the rest. */
        .container.has-weather {
            grid-template-columns: 1fr 28vw;
            grid-template-areas: 'header header' 'main weather';
            column-gap: 16px;
        }

        .header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 7vw;
            line-height: 1.1;
            padding-bottom: 6px;
            border-bottom: 2px solid #000;
        }

        /* Sunrise and sunset sit in the free middle of the header. */
        .header .sun {
            align-self: center;
            display: flex;
            gap: 2.4vw;
            font-size: 2.6vw;
            font-weight: 600;
        }

        .header .sun span {
            display: inline-flex;
            align-items: center;
            gap: 0.6vw;
        }

        .header .sun svg {
            width: 3.2vw;
            height: 3.2vw;
        }

        .header .day {
            font-weight: 600;
            margin-right: 0.25em;
        }

        /* One grid for every board, so columns line up between them. Each column is as wide
           as its widest entry (never narrower than its minimum), rather than stretching to
           fill the screen. The text shrinks as lines are added (--lines) to fit the height
           left under the header. */
        .departures {
            grid-area: main;
            min-width: 0;
            min-height: 0;
            --lines: 1;
            font-size: min(3vw, calc(68vh / (var(--lines) * 1.35)));
            padding-top: 0.4em;
            display: grid;
            grid-template-columns:
                minmax(2.6em, max-content)  /* time */
                minmax(2.6em, max-content)  /* expected */
                minmax(0, max-content)      /* destination, ellipsised if the screen is too narrow */
                minmax(2.8em, max-content); /* countdown */
            column-gap: 0.9em;
            justify-content: start;
            align-content: start;
        }

        /* Boards and rows take the parent's columns instead of making their own. */
        .departures .board,
        .departures .row {
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: subgrid;
            align-items: baseline;
        }

        .departures .board h2 {
            grid-column: 1 / -1;
            margin: 0;
            padding-top: 0.7em;
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 0.04em;
            line-height: 1.25;
        }

        .departures .board h2 .station {
            margin-left: 0.5em;
            font-size: 0.9em;
            font-weight: 300;
            letter-spacing: 0;
        }

        /* Shown when the board is from an earlier fetch, because its source failed. */
        .departures .board h2 .age {
            margin-left: 0.6em;
            font-size: 0.7em;
            font-weight: 300;
            letter-spacing: 0;
            font-style: italic;
        }

        .departures .board:first-child h2 {
            padding-top: 0;
        }

        .departures .row {
            padding: 0.1em 0;
            line-height: 1.25;
            white-space: nowrap;
        }

        .departures .destination {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* A live prediction has no expected time, so the destination uses that column too. */
        .departures .row.live .destination {
            grid-column: 2 / span 2;
        }

        .departures .countdown {
            text-align: right;
        }

        .departures .row.none {
            display: block;
            font-style: italic;
        }

        .departures .row.cancelled > * {
            text-decoration: line-through;
        }

        /* The scheduled time stays as is; the new time beside it is what to go by. */
        .departures .row.delayed .expected {
            font-weight: 600;
        }

        .weather .stale-note,
        .weather .unavailable {
            font-size: 1.7vw;
            font-weight: 300;
            font-style: italic;
        }

        .weather {
            grid-area: weather;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Starts level with the first board, under the header's rule. */
            justify-content: flex-start;
            gap: 1.6vh;
            padding: 1.4vw 0.8vw 0;
            text-align: center;
        }

        .weather .now {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75vw;
        }

        .weather .icon svg {
            display: block;
            width: 5.5vw;
            height: 5.5vw;
            /* The cloud's weight sits low in its box. */
            transform: translateY(-0.3vw);
        }

        /* Trimmed to digit height so the high lines up with the top of the temperature
           and the low with its baseline. */
        .weather .trim {
            display: block;
            line-height: 1;
            text-box: trim-both cap alphabetic;
        }

        .weather .current {
            font-size: 6.25vw;
        }

        .weather .range {
            align-self: stretch;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
            font-size: 2.5vw;
            font-weight: 600;
        }

        .weather .range > div {
            display: flex;
            align-items: center;
            gap: 0.4vw;
        }

        .weather .range svg {
            display: block;
            height: 0.62em;
            width: auto;
            fill: #000;
        }

        /* A hand, as in "to the touch": the temperature it feels like, when that's not the
           temperature it is. */
        .weather .feels {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3vw;
            font-size: 2.5vw;
            font-weight: 600;
        }

        .weather .feels svg {
            display: block;
            width: 2.8vw;
            height: 2.8vw;
        }

        .weather .uv {
            font-size: 2vw;
            font-weight: 600;
            letter-spacing: 0.06em;
        }

        .weather .uv span {
            font-weight: 300;
            letter-spacing: 0;
        }

        .weather .precipitation {
            width: 100%;
        }

        .weather .precipitation .caption {
            font-size: 1.7vw;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-top: 0.6vh;
        }

        .weather .precipitation svg {
            display: block;
            width: 21vw;
            height: auto;
            margin: 0 auto;
            overflow: visible;
        }

        .weather .precipitation text {
            font-family: 'Overpass', sans-serif;
            font-size: 12px;
            fill: #000;
        }

        .weather .precipitation text.strong {
            font-weight: 600;
        }

        /* Overall and each pollutant share one set of columns: name, score, band. Good rows
           are lighter so what needs attention stands out. */
        .weather .air {
            width: 100%;
            margin-top: 2vh;
            font-size: 2vw;
            line-height: 1.3;
            text-align: left;
            display: grid;
            grid-template-columns: 1fr 3ch auto;
            column-gap: 1vw;
            align-items: baseline;
        }

        .weather .air .score {
            text-align: right;
        }

        .weather .air .band {
            min-width: 5.6ch;
        }

        .weather .air .overall {
            font-size: 2.2vw;
            font-weight: 600;
        }

        .weather .air .rule {
            grid-column: 1 / -1;
            border-bottom: 2px solid #000;
            margin: 0.4vh 0 0.6vh;
        }

        .weather .air .good {
            font-weight: 300;
        }

        .weather .air .attention {
            font-weight: 600;
        }
    </style>
