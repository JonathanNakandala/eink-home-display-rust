# =============================================================================
# reTerminal E1003 - shows the image served by eink-home-display-rust
# =============================================================================
# Each wake: join Wi-Fi, ask the server's /plan what is current, download and draw the image
# only if it changed, then sleep for as long as the server says.
# The server's address and port are found over mDNS and remembered across sleeps; the
# download only goes looking again when the remembered one stops working.
# The server side is `[server]` and `[display]` in the Rust app's config.
# The device says which formats it can decode (`accept_formats`), the server picks one it has, and the
# response's Content-Type tells the decoder which it is, so nothing here needs to match the server.
#
# Requires ESPHome >= 2026.7.0 for the it8951 display platform.
# Hardware pins are taken from reference/esphome.yaml (Seeed's full example).
#
# Maintenance: hold the middle button (KEY1) while waking and the device stays
# awake instead of sleeping, so it can be updated over the air.
# =============================================================================
substitutions:
  device_name: reterminal-e1003
  friendly_name: "reTerminal_E1003"
  # The server is found over mDNS, so nothing here needs to change when its address or
  # port does. Used only until the first successful scan, or if a scan finds nothing:
  fallback_base: "http://e-ink-home-display.local:8080"
  # The panel's size: the decoded image buffer is this many bytes (checked against PSRAM before a download).
  image_width: "1872"
  image_height: "1404"
  # What the device can decode, as an Accept header: the server sends one of these, preferring its own
  # choice (display.image_format) among equals. Weight one to rank it, e.g. "image/png, image/bmp;q=0.5".
  accept_formats: "image/bmp, image/png, image/qoi"
  # The paths the Rust app serves the image and its plan at.
  image_path: /image
  plan_path: /plan
  refresh_path: /refresh
  # Pick a server by the name a scan shows (the Rust app's server.instance_name).
  # Empty takes the first image server found.
  server_name: ""
  # Only used when the server can't be reached; normally the server's /plan says when to wake.
  sleep_duration: 10min
  sleep_duration_ms: "600000"
  # After repeated failures the sleep doubles each time, up to this.
  max_backoff_ms: "3600000"
  # The board halves the cell voltage before the ADC pin (two equal resistors); this undoes it.
  battery_divider: "2.0"
  # Battery thresholds, in volts (see the README). Below `low` a label says so on every picture;
  # below `empty` the device stops refreshing and sleeps `battery_halt_sleep_ms` between checks;
  # it starts again, and clears both, only once the voltage is back above `resume`.
  battery_low_v: "3.40"
  battery_empty_v: "3.30"
  battery_resume_v: "3.60"
  battery_halt_sleep_ms: "21600000"
  # How long the panel needs to finish drawing before power is cut.
  refresh_settle: 15s
  # A wake that hasn't finished by now is treated as failed: it counts towards the backoff and sleeps.
  # Longer than the slowest normal wait for the server (a button refresh waits for it to render), and
  # shorter than the `run_duration` that backs it up.
  wake_timeout: 110s
  # Where the clock is set from, tried in this order (at most three). The clock is needed before TLS, to check a
  # certificate's dates. It survives deep sleep, so this matters after a power cut and for drift.
  # A server that doesn't answer is given up on only after a wait, which is radio time on every wake, so put a
  # local one first (your router, or a machine running chrony or ntpd) only if it is really there. The others
  # are public and from different operators, so one being down doesn't leave the display without a time.
  ntp_server_1: 0.pool.ntp.org
  ntp_server_2: time.cloudflare.com
  ntp_server_3: time.google.com
  # How long to wait for the clock to be set before giving up on this wake (it is tried again on the next).
  clock_wait: 20s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Appends the last three bytes of the chip's MAC address to the name (reterminal-e1003-a1b2c3). The MAC is
  # burned into the chip, so the name is unique to this display and survives flashing, and the same file can be
  # flashed to several displays without them sharing a name. The server tells displays apart by this name: it is
  # sent with every request (`App.get_name()`), so two displays are never mixed up.
  name_add_mac_suffix: true
  includes:
    - eink_discovery.h
    - eink_notice.h
    - eink_health.h
    - eink_battery.h
    - eink_wake.h
    - eink_clock.h
    - eink_plan.h
    - eink_format.h
    - eink_report.h
    - eink_telemetry.h
  on_boot:
    priority: -100
    then:
      # Battery measurement circuit
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: maintenance_button
          then:
            - logger.log: "Maintenance mode: staying awake"
            # Latched, so letting go of the button doesn't end it: the sleeps below check this, not the pin.
            - lambda: 'id(maintenance) = true;'
            - deep_sleep.prevent: deep_sleep_1
            # Wi-Fi is normally left off until the battery has been checked; an update over the air
            # needs it whatever the battery says.
            - wifi.enable
      - script.execute: wake_watchdog
      - script.execute: battery_gate

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf
    advanced:
      # Lets lwIP's resolver look up .local names (ESPHome's own mDNS only advertises).
      # Some versions default it off to save flash, so set it explicitly.
      enable_lwip_mdns_queries: true

# OPI PSRAM holds the decoded image and the 16-level framebuffer.
psram:
  mode: octal

# The CH340K USB bridge is on UART0, not the default USB_CDC.
logger:
  hardware_uart: UART0

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  # Off until `start_wake` turns it on, so the battery is read with the radio idle (its transmit bursts
  # pull the cell down) and a flat battery never starts it at all.
  enable_on_boot: false

http_request:
  # Plain HTTP on the LAN; TLS would cost a lot of RAM for nothing.
  # Long enough for the server to render when the button asks for it (it waits up to 40 s).
  timeout: 50s
  watchdog_timeout: 70s

json:

online_image:
  - id: dashboard
    url: ${fallback_base}${image_path}
    # Decoded by the response's Content-Type (image/bmp, image/png or image/qoi), so the server decides which to send.
    format: AUTO
    request_headers:
      Accept: ${accept_formats}
    type: GRAYSCALE
    update_interval: never
    # The panel is 1872x1404 and the image is rendered at that size, so no resize.
    on_download_finished:
      # Downloaded: what is left (the draw and the settle) takes a known time, and must not be cut short.
      - script.stop: wake_watchdog
      - logger.log: "Image downloaded, drawing"
      - component.update: epaper_display
      - delay: ${refresh_settle}
      # Only now is the picture on the panel. Recorded any earlier, a reset or power loss during the
      # refresh would leave the device believing it shows an image it doesn't, and the next wake would
      # skip it. Recorded here, an interrupted refresh leaves the old version, so the next wake downloads again.
      - lambda: |-
          id(shown_version) = id(plan_version);
          id(notice_on_panel) = false;
          id(low_label_on_panel) = id(battery_low);
      - script.execute: after_image
    on_error:
      # /plan has just answered from this address, so the server is where it should be: looking for it
      # again would find the same thing. The log line above this says what went wrong.
      - lambda: 'id(fail_reason) = "download";'
      - script.execute: give_up

globals:
  # The server found last time. Kept across deep sleep; 0 means none yet.
  - id: server_ip
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: server_port
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  # How far ahead of UTC the server's timezone is, in seconds, as of its last /plan. The device has no timezone
  # database, and a failure is often a server it couldn't reach, so it is kept across sleeps. Used only for the time
  # in the failure notice; unknown until the first /plan.
  - id: utc_offset_s
    type: int32_t
    restore_value: yes
    initial_value: '0'
  - id: utc_offset_known
    type: bool
    restore_value: yes
    initial_value: 'false'
  # The render on the panel now (the server's /plan `version`). Kept across deep sleep; 0 means unknown.
  - id: shown_version
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # Why this wake failed: wifi, server (no usable /plan), download, memory, or timeout (the `wake_watchdog`
  # ran out). Empty if it didn't.
  - id: fail_reason
    type: std::string
    restore_value: no
  # Wakes in a row that failed. Drives the backoff; 0 after a wake that finished with the image current.
  - id: failed_wakes
    type: uint8_t
    restore_value: yes
    initial_value: '0'
  # The clock reads a time it could only have from SNTP (and not one before a render the server has made), so a
  # certificate can be checked against it. Set by `ensure_clock`; false until it has run on this wake.
  - id: clock_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  # A notice is on the panel instead of (part of) the picture, so the next good wake must redraw it.
  - id: notice_on_panel
    type: bool
    restore_value: yes
    initial_value: 'false'
  # The battery has gone below `battery_empty_v` and not yet recovered past `battery_resume_v`:
  # nothing is refreshed. Kept across deep sleep.
  - id: battery_halted
    type: bool
    restore_value: yes
    initial_value: 'false'
  # Below `battery_low_v` and not yet recovered past `battery_resume_v`: every picture carries a label.
  - id: battery_low
    type: bool
    restore_value: yes
    initial_value: 'false'
  # The picture on the panel has that label baked in, so a change in `battery_low` needs a redraw.
  - id: low_label_on_panel
    type: bool
    restore_value: yes
    initial_value: 'false'
  # This wake's battery reading.
  - id: battery_known
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: battery_mv
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: battery_pct
    type: int
    restore_value: no
    initial_value: '0'
  # 0 ok, 1 low, 2 empty.
  - id: battery_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: battery_action
    type: int
    restore_value: no
    initial_value: '0'
  # This wake's state.
  - id: plan_version
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # KEY1 was held at boot: stay awake for an update over the air, however long the button is held.
  - id: maintenance
    type: bool
    restore_value: no
    initial_value: 'false'
  # When this wake's plan arrived (millis), so the sleep can be shortened by the time the wake took.
  # 0 when the sleep isn't the server's plan (a backoff, or no plan).
  - id: plan_received_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Woken by the button, so ask the server to render now.
  - id: force_refresh
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: plan_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: plan_changed
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: plan_stale
    type: bool
    restore_value: no
    initial_value: 'false'
  # Milliseconds the server asked us to sleep; 0 means use sleep_duration.
  - id: plan_sleep_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: plan_age_seconds
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: searched
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: server_found
    type: bool
    restore_value: no
    initial_value: 'false'
  # Draw a notice in the corner instead of the picture, and what it says.
  - id: show_notice
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: notice_text
    type: std::string
    restore_value: no

script:
  # First thing every wake, before the radio or the panel are used: read the battery and, if it is too
  # low to carry on, stop. Voltage is read once, with the load light, so it isn't pulled down by Wi-Fi.
  - id: battery_gate
    then:
      - lambda: |-
          // sample() is the voltage at the pin, before the sensor's filters, so undo the divider here.
          float v = id(battery_voltage).sample() * ${battery_divider}f;
          // What the reading means, and the latches and what to do about them, are worked out in eink_battery.h.
          auto battery = eink_battery::assess(v, id(battery_halted), id(battery_low), ${battery_low_v},
                                              ${battery_empty_v}, ${battery_resume_v});
          id(battery_known) = battery.known;
          id(battery_action) = battery.verdict.action;
          if (!battery.known) {
            // No battery, or a bad reading: never a reason to stop.
            ESP_LOGW("battery", "Unusable reading (%.2f V); carrying on", v);
            return;
          }
          id(battery_mv) = battery.mv;
          id(battery_pct) = battery.pct;
          id(battery_halted) = battery.verdict.halted;
          id(battery_low) = battery.verdict.low;
          id(battery_state) = battery.verdict.state;
          ESP_LOGI("battery", "%.2f V, %d%%, %s", v, id(battery_pct), eink_battery::state_name(id(battery_state)));
      - if:
          condition:
            lambda: 'return id(battery_action) == 2;'
          then:
            - logger.log: "Battery empty: showing the notice and stopping"
            - lambda: |-
                id(notice_text) = "Battery empty - charge to resume";
                id(show_notice) = true;
                id(notice_on_panel) = true;
            - component.update: epaper_display
            - delay: ${refresh_settle}
            - script.execute: battery_sleep
          else:
            - if:
                condition:
                  lambda: 'return id(battery_action) == 1;'
                then:
                  - logger.log: "Battery still empty: sleeping"
                  - script.execute: battery_sleep
                else:
                  - script.execute: start_wake

  # Halted: no Wi-Fi, no refresh; just wake now and then to see whether it has been charged.
  - id: battery_sleep
    then:
      - if:
          condition:
            lambda: 'return !id(maintenance);'
          then:
            - lambda: 'eink_telemetry::record_wake(millis());'
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: ${battery_halt_sleep_ms}ms

  # The normal wake: Wi-Fi, then the server.
  - id: start_wake
    then:
      - wifi.enable
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - if:
          condition:
            wifi.connected:
          then:
            # KEY0 wakes the device from deep sleep: that wake asks for a fresh render.
            - lambda: |-
                id(force_refresh) = esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT1;
                if (id(force_refresh))
                  ESP_LOGI("button", "Woken by the button: asking the server for a fresh render");
            - script.execute: check_plan
          else:
            # Without Wi-Fi there is no point asking the server, or looking for it.
            - lambda: 'id(fail_reason) = "wifi";'
            - script.execute: give_up

  # Asks the server what is current: whether the image changed, whether it is stale, and when to come back.
  # After a button wake it asks for a render first (POST /refresh), which answers the same way.
  - id: check_plan
    then:
      - if:
          condition:
            lambda: 'return id(force_refresh);'
          then:
            - http_request.post:
                url: !lambda |-
                  std::string base = eink_format::server_base(id(server_ip), id(server_port), "${fallback_base}");
                  return base + "${refresh_path}?have=" + std::to_string(id(shown_version)) +
                         eink_telemetry::query(App.get_name().str(), id(failed_wakes),
                                               {id(battery_known), id(battery_mv), id(battery_pct),
                                                eink_battery::state_name(id(battery_state))});
                capture_response: true
                max_response_buffer_size: 1024
                on_response:
                  - script.execute:
                      id: handle_plan
                      code: !lambda 'return response->status_code;'
                      body: !lambda 'return body;'
          else:
            - http_request.get:
                url: !lambda |-
                  std::string base = eink_format::server_base(id(server_ip), id(server_port), "${fallback_base}");
                  return base + "${plan_path}?have=" + std::to_string(id(shown_version)) +
                         eink_telemetry::query(App.get_name().str(), id(failed_wakes),
                                               {id(battery_known), id(battery_mv), id(battery_pct),
                                                eink_battery::state_name(id(battery_state))});
                capture_response: true
                max_response_buffer_size: 1024
                on_response:
                  - script.execute:
                      id: handle_plan
                      code: !lambda 'return response->status_code;'
                      body: !lambda 'return body;'

  # Reads the server's plan, then downloads the image, or skips it when it hasn't changed.
  - id: handle_plan
    parameters:
      code: int
      body: string
    then:
      - lambda: |-
          bool ok = code == 200 && json::parse_json(body, [](JsonObject root) -> bool {
            if (!root["version"].is<uint32_t>() || !root["next_seconds"].is<uint32_t>())
              return false;
            id(plan_version) = root["version"].as<uint32_t>();
            id(plan_changed) = root["changed"] | true;
            id(plan_stale) = root["stale"] | false;
            id(plan_age_seconds) = root["age_seconds"] | 0;
            // The server's zone, as how far it is ahead of UTC now. Kept only if it is a real offset.
            if (eink_plan::keeps_offset(root["utc_offset_seconds"].is<int32_t>(),
                                        root["utc_offset_seconds"].as<int32_t>())) {
              id(utc_offset_s) = root["utc_offset_seconds"].as<int32_t>();
              id(utc_offset_known) = true;
            }
            id(plan_sleep_ms) = eink_wake::plan_sleep_ms(root["next_seconds"].as<uint32_t>());
            return true;
          });
          if (!ok)
            ESP_LOGW("plan", "No usable plan (HTTP %d): %s", code, body.c_str());
          id(plan_ok) = ok;
          if (ok) {
            // Not `failed_wakes = 0` here: the plan answering isn't the wake succeeding. The image can still
            // fail to download, and resetting now would keep that failure at the first backoff step forever.
            id(plan_received_ms) = millis();
            // The picture is also redrawn to clear a notice or to add or remove the battery label (eink_plan.h).
            id(plan_changed) = eink_plan::needs_draw(id(plan_changed), id(plan_stale),
                                                     {id(notice_on_panel), id(low_label_on_panel), id(battery_low)});
          }
      - if:
          condition:
            lambda: 'return !id(plan_ok);'
          then:
            - script.execute: server_failed
          else:
            - if:
                condition:
                  lambda: 'return id(plan_changed);'
                then:
                  - logger.log: "Image changed, downloading"
                  - script.execute: fetch_image
                else:
                  - logger.log: "Image unchanged, skipping refresh"
                  - script.execute: after_image

  # Downloads the image from the remembered server, if there is memory to decode it into.
  - id: fetch_image
    then:
      - if:
          condition:
            lambda: 'return eink_health::image_buffer_fits(${image_width}, ${image_height});'
          then:
            - online_image.set_url:
                id: dashboard
                # The download is started by the component.update below, once; set_url would otherwise start
                # it too, and a second request would run after a failed one.
                update: false
                # Says who is asking, so the server knows which display it sent this image to.
                url: !lambda |-
                  std::string base = eink_format::server_base(id(server_ip), id(server_port), "${fallback_base}");
                  return base + "${image_path}?device=" + App.get_name().str();
            - component.update: dashboard
          else:
            # Not the server's fault, so don't go looking for it.
            - lambda: 'id(fail_reason) = "memory";'
            - script.execute: give_up

  # The image is current (just drawn, or already on the panel): say so if the server is behind, then sleep.
  - id: after_image
    then:
      # The wake worked: the server answered and the picture on the panel is current.
      - script.stop: wake_watchdog
      - lambda: |-
          id(failed_wakes) = 0;
          eink_telemetry::clear_failure();
      - if:
          condition:
            # Once per spell: the text has an age in it, which would otherwise redraw every wake.
            lambda: 'return id(plan_stale) && !id(notice_on_panel);'
          then:
            - lambda: |-
                id(notice_text) = eink_format::stale_notice(id(plan_age_seconds));
                id(show_notice) = true;
                id(notice_on_panel) = true;
            - component.update: epaper_display
            - delay: ${refresh_settle}
      - script.execute: sleep_now

  # Waits (up to `clock_wait`) for SNTP to set the clock, then says in `clock_ok` whether it can be used. A false
  # answer means "try again next wake": nothing about the pairing is touched, and nothing that depends on the
  # time (every TLS connection) is tried. Run before the first of those, once Wi-Fi is up.
  - id: ensure_clock
    then:
      - lambda: 'id(clock_ok) = eink_clock::usable(id(sntp_time).now().timestamp, id(shown_version));'
      - if:
          condition:
            lambda: 'return !id(clock_ok);'
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - wait_until:
                      condition:
                        lambda: 'return eink_clock::usable(id(sntp_time).now().timestamp, id(shown_version));'
                      timeout: ${clock_wait}
            - lambda: 'id(clock_ok) = eink_clock::usable(id(sntp_time).now().timestamp, id(shown_version));'
            - if:
                condition:
                  lambda: 'return !id(clock_ok);'
                then:
                  - logger.log:
                      format: "The clock is not set (it reads %lld); not trying anything that needs it"
                      args: ['(long long) id(sntp_time).now().timestamp']
                      level: WARN

  # Sleeps for as long as the server asked, or sleep_duration if it never answered.
  - id: sleep_now
    then:
      - if:
          condition:
            lambda: 'return !id(maintenance);'
          then:
            # How long this wake was awake, which the next one tells the server (it costs battery).
            - lambda: 'eink_telemetry::record_wake(millis());'
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: !lambda |-
                  // The server counted from when it answered; this takes off what the wake has used since.
                  return eink_wake::sleep_after(id(plan_sleep_ms) ? id(plan_sleep_ms) : (uint32_t) (${sleep_duration_ms}),
                                                id(plan_received_ms), millis());

  # The server didn't answer, or answered badly. It may have moved: look once per wake, then ask again.
  - id: server_failed
    then:
      - lambda: 'id(fail_reason) = "server";'
      - if:
          condition:
            lambda: 'return !id(searched);'
          then:
            - script.execute: discover
            - if:
                condition:
                  lambda: 'return id(server_found);'
                then:
                  - script.execute: check_plan
                else:
                  - script.execute: give_up
          else:
            - script.execute: give_up

  # Asks the network where the server is, and remembers the answer.
  - id: discover
    then:
      - lambda: |-
          id(searched) = true;
          eink_discovery::Server server;
          id(server_found) = eink_discovery::find(server, "${server_name}");
          if (!id(server_found))
            return;
          id(server_ip) = server.ip;
          id(server_port) = server.port;

  # Backstop for a wake that hangs (a server that accepts the connection and goes quiet). Without it the
  # only way out is `run_duration`, which sleeps the normal time and counts nothing, so each wake would burn
  # that long awake every sleep_duration for as long as the server stayed that way. This counts it as a
  # failure instead, so the backoff applies. It stands down once the wake reaches a step that ends in a
  # known time (the image downloaded, the wake succeeded, or it gave up). Not in maintenance mode.
  - id: wake_watchdog
    then:
      - delay: ${wake_timeout}
      - if:
          condition:
            lambda: 'return !id(maintenance);'
          then:
            - lambda: 'id(fail_reason) = "timeout";'
            - logger.log:
                level: WARN
                format: "The wake didn't finish in ${wake_timeout}: giving up"
            - script.execute: backoff
            - script.execute: sleep_now

  # Counts a failed wake and works out how long to sleep: sleep_duration, doubling with each failure in a row.
  - id: backoff
    then:
      - lambda: |-
          id(failed_wakes) = eink_wake::count_failure(id(failed_wakes));
          // 1st failure: sleep_duration, 2nd: twice that, and so on, up to max_backoff_ms.
          id(plan_sleep_ms) = eink_wake::backoff_ms(id(failed_wakes), ${sleep_duration_ms}, ${max_backoff_ms});
          // Not the server's plan, so not shortened by the time the wake took.
          id(plan_received_ms) = 0;
          // Told to the server by the next wake that gets through.
          eink_telemetry::set_failure(id(fail_reason));
          ESP_LOGW("backoff", "Failure %u in a row (%s); sleeping %u s", (unsigned) id(failed_wakes),
                   id(fail_reason).c_str(), (unsigned) (id(plan_sleep_ms) / 1000));

  # Nothing worked: the picture stays on the panel (e-paper keeps it). The first failure in a row
  # writes a notice in the corner saying when; after that it stays quiet and sleeps longer each time
  # (doubling, up to max_backoff_ms), so a server that is down doesn't drain the battery.
  - id: give_up
    then:
      # It failed in a way that was noticed, so the watchdog has nothing to add: left running it would count
      # the failure twice, or cut the notice's refresh short.
      - script.stop: wake_watchdog
      - script.execute: backoff
      - if:
          condition:
            lambda: 'return id(failed_wakes) == 1 && !id(notice_on_panel);'
          then:
            - logger.log: "First failure, showing notice"
            # The clock survives deep sleep; this just gives a fresh start a moment to sync.
            - if:
                condition:
                  wifi.connected:
                then:
                  - wait_until:
                      condition:
                        time.has_time:
                      timeout: 8s
            - lambda: |-
                // What went wrong, in a few words (the log has the detail), and when, if the time can be told.
                auto now = id(sntp_time).now();
                id(notice_text) = eink_format::failure_notice(id(fail_reason), now.is_valid(), now.timestamp,
                                                              id(utc_offset_known), id(utc_offset_s));
                id(show_notice) = true;
                id(notice_on_panel) = true;
            - component.update: epaper_display
            - delay: ${refresh_settle}
      - script.execute: sleep_now

time:
  - platform: sntp
    id: sntp_time
    # Left at UTC: the display's local time is the server's, from its plan (`utc_offset_s`), so the zone is set in one
    # place. Not set at all, ESPHome would use the zone of the computer that builds the firmware.
    timezone: UTC
    # Up to three, tried in order; lwIP moves to the next when one doesn't answer. See `ntp_server_1`.
    servers:
      - ${ntp_server_1}
      - ${ntp_server_2}
      - ${ntp_server_3}

font:
  # The dashboard's own font, from the Rust app's templates; only the glyphs the notice needs.
  - file: ../templates/fonts/Overpass/Overpass-SemiBold.ttf
    id: notice_font
    size: 36
    glyphs: " :@%-.0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

display:
  - platform: it8951
    id: epaper_display
    spi_id: epaper_spi_bus
    model: seeed-reterminal-e1003
    update_interval: never
    grayscale: true
    # The Rust app already reduced the image to 16 greys (display.dither there).
    dithering: false
    update_mode: GC16
    transform:
      mirror_x: true
      mirror_y: false
    lambda: |-
      if (id(show_notice)) {
        // Only this corner is refreshed; the rest of the panel keeps its picture.
        eink_notice::draw(*id(epaper_display), id(notice_font), id(notice_text));
      } else {
        it.image(0, 0, id(dashboard));
        // Drawn into the same refresh as the picture, so it costs nothing extra.
        if (id(battery_low))
          eink_notice::label(it, id(notice_font), "Battery low " + std::to_string(id(battery_pct)) + "% - please charge");
      }

output:
  # Battery measurement enable
  - platform: gpio
    pin: GPIO40
    id: bsp_battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    # Averaged inside each reading, which is what battery_gate takes.
    samples: 16
    update_interval: 60s
    filters:
      # Onboard 1:2 voltage divider
      - multiply: ${battery_divider}
  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

binary_sensor:
  # KEY1, the middle button: held at wake to stay awake for updates.
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT
      inverted: true
    id: maintenance_button
    internal: true

deep_sleep:
  id: deep_sleep_1
  # Last resort behind the `wake_watchdog` script (${wake_timeout}), which does the same with the backoff;
  # the normal exit is deep_sleep.enter above.
  # Longer than the watchdog, with room for the failure path it leaves running: two /plan timeouts, a
  # lookup and then the notice.
  run_duration: 180s
  sleep_duration: ${sleep_duration}
  # KEY0, the right green button, wakes it early for an immediate refresh.
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        mode: INPUT_PULLUP
    mode: ANY_LOW
