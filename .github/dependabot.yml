version: 2
updates:
  # The actions the workflows use. Grouped into one pull request, so a month's updates are one review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A version is taken only once it has been out this long: a release that turns out to be malicious or broken is usually pulled
    # within days. Does not delay a security update.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Security fixes and the updates inside Cargo.toml's ranges, in one pull request a month. Anything bigger is a
  # decision for a person, so is not opened.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: ["minor", "patch"]
