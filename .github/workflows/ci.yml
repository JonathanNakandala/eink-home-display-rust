name: ci

on:
  pull_request:
    # The firmware and the documents have nothing here to check.
    paths-ignore: ["esphome/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["esphome/**", "**/*.md"]
  # The release runs this first (release-please.yml), so nothing is published from a commit that fails it.
  workflow_call:
  workflow_dispatch:

# A newer push to the same branch or PR makes the run in progress pointless, so it is cancelled. Runs on main are
# never cancelled: each one refreshes the cache that pull requests restore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Nothing here is built twice, so incremental data would only fill the cache.
  CARGO_INCREMENTAL: 0
  # No debug info: the tests don't need it, and it is most of the size of `target/`, which is what is cached.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Retry a flaky download from crates.io instead of failing the run.
  CARGO_NET_RETRY: 5

defaults:
  run:
    # Named, so that it runs with `-eo pipefail`: the default `bash -e` lets a failure in the middle of a pipe pass.
    shell: bash

jobs:
  # Seconds, and needs no build, so it runs (and fails) first and alone.
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - run: cargo fmt --check

  # Lints and tests share one job, and so one `target/`: the second reuses the dependencies the first built.
  # What the git hooks run locally (pre-commit: fmt and clippy, pre-push: test), so a push that passed them passes here.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache. A pull request restores main's, and a cache each for a hundred branches would
          # push the one that matters out of the repository's 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The tests marked #[ignore] need Chrome or multicast networking, and are run by hand.
      - run: cargo test --locked

  # The installer, its scripts and the units, which nothing else here runs.
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner has shellcheck. Warnings and errors fail the job; style notes do not.
      - run: shellcheck --severity=warning deploy/*.sh deploy/packaging/*.sh .github/scripts/*.sh
      # The backup and the restore, tried on a made-up copy of the server's state in a folder of their own (as root, which they
      # require): what is kept and what is left out, how many, a restore, a damaged archive, encryption, a copy elsewhere.
      - name: Backup and restore
        run: |
          sudo apt-get install --yes --no-install-recommends age rsync
          sudo bash .github/scripts/test-backup.sh
      # systemd's own check of the units: unknown settings, a missing user or program, a timer without its service. The program
      # and the user are made here so that it has something to find; it runs nothing.
      - name: Check the units
        run: |
          sudo install -D -m 0644 deploy/home-display.sysusers /etc/sysusers.d/home-display.conf
          sudo systemd-sysusers /etc/sysusers.d/home-display.conf
          sudo install -m 0755 /bin/true /usr/local/bin/home-display-server
          sudo install -m 0755 /bin/true /usr/local/bin/home-display-health-check
          sudo install -m 0755 /bin/true /usr/local/bin/home-display-backup
          systemd-analyze verify deploy/home-display.service deploy/home-display-health.service deploy/home-display-health.timer \
            deploy/home-display-backup.service deploy/home-display-backup.timer
