[package]
name = "home-display-server"
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Draws a dashboard (weather, train departures) and serves it to e-ink displays"
repository = "https://github.com/JonathanNakandala/eink-home-display-rust"
readme = "README.md"
# The highest of what the dependencies need (aes 1.89); edition 2024 alone needs 1.85. Built and tested on the current stable.
rust-version = "1.89"
# Released as programs (see deploy/), not as a crate, so `cargo publish` is not to be run by mistake.
publish = false

# Don't add `panic = "abort"`, however much smaller it makes the binary. If a render panics, the server catches it, counts
# that one run as failed and carries on with the next. With "abort" the same panic would end the whole process instead.
[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0.86"
axum = { version = "0.8", features = ["http1", "tokio", "macros"] }
utoipa = { version = "6", features = ["chrono", "axum_extras", "preserve_order"] }
utoipa-axum = "0.3"
async-trait = "0.1.81"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.15", features = ["toml"] }
derive-new = "0.7"
flate2 = "1.0"
handlebars = "6.0.0"
headless_chrome = { version = "1.0.22", features = ["fetch"] }
image = "0.25.2"
log = "0.4.22"
reqwest = { version = "0.13", features = ["json", "query", "rustls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.120"
serde_valid = { version = "3", features = ["toml"] }
tempfile = "3.10.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["timeout", "trace", "set-header"] }
url = "2"
futures-util = "0.3"
trait-variant = "0.1.2"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
embedded-hal = "1.0.0"
schemars = "1"
toml = "1"
croner = "4.0.0"
humantime = "2.4.0"
mdns-sd = "0.21.4"
if-addrs = "0.15"
socket2 = { version = "0.6", features = ["all"] }
httpdate = "1.0.3"
secrecy = { version = "0.10.3", features = ["serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
sha2 = "0.11"
subtle = "2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs", "x509-parser", "zeroize"] }
zeroize = "1"
x509-parser = { version = "0.18", features = ["verify-aws"] }
time = "0.3"
getrandom = "0.4.3"
base64 = "0.23.1"
rustls-pki-types = "1.15.1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
http-body-util = "0.1"
interprocess = { version = "2.4", features = ["tokio"] }
hyper-util = { version = "0.1.21", features = ["server", "http1", "tokio", "service"] }
arc-swap = "1.9.2"
yasna = "0.6"
qrcode = { version = "0.14.1", default-features = false }
rpassword = "7"

# Only with `--features otel`; see src/bootstrap/telemetry.rs. Spans and logs go to an OTLP collector (Grafana Alloy) over HTTP.
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.33", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }

[features]
# Exports traces and logs over OTLP when OTEL_EXPORTER_OTLP_ENDPOINT is set. Off by default: it adds a good many dependencies.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-appender-tracing", "dep:tracing-opentelemetry"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
httpmock = "0.8"
speculoos = "0.13"
cms = "0.2.3"
jsonschema = { version = "0.59", default-features = false }
rqrr = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = "0.5"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
