[package]
name = "eink-home-display-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
axum = { version = "0.7.9", features = ["http1", "tokio", "macros"] }
async-trait = "0.1.81"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.15", features = ["toml"] }
derive-new = "0.7"
flate2 = "1.0"
handlebars = "6.0.0"
headless_chrome = { version = "1.0.22", features = ["fetch"] }
image = "0.25.2"
log = "0.4.22"
reqwest = { version = "0.13", features = ["json", "query", "rustls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.120"
serde_valid = { version = "3", features = ["toml"] }
tempfile = "3.10.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6.2", features = ["trace"] }
url = "2"
futures-util = "0.3"
trait-variant = "0.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
embedded-hal = "1.0.0"
schemars = "1"
toml = "1"
croner = "4.0.0"
humantime = "2.4.0"
mdns-sd = "0.21.4"
socket2 = { version = "0.6", features = ["all"] }
httpdate = "1.0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
httpmock = "0.8"
speculoos = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = "0.5"
