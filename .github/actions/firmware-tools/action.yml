name: firmware-tools
description: >
  Installs the tools that check and build the ESPHome firmware, at the versions pinned in pyproject.toml and poetry.lock
  (see there for why a repository that is not a Python project has them). The repository must already be checked out.

runs:
  using: composite
  steps:
    # Poetry as the one that wrote poetry.lock (its first line says which), so the lock is read as it was written.
    - run: pipx install poetry==2.5.1
      shell: bash
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    # `--no-root`: there is nothing to build or install, only the tools. In .venv, as poetry.toml says, where the Makefile's
    # `poetry run` finds them.
    - run: poetry install --no-root --no-interaction
      shell: bash
