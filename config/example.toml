#:schema ./schema.json
# Generated by `cargo run --bin gen_config -- --write`; edit src/config/example.rs instead.

[weather]
enabled = true
provider = "OpenWeather"

[weather.open_weather]
api_key = "00000000000000000000000000000000"
host_url = "https://api.openweathermap.org"

[[departures]]
name = "NORTHBOUND"
enabled = true
rows = 4
travel_minutes = 5
provider = "OpenLdbws"
from = "HRN"
to = "WIH"

[[departures]]
name = "SOUTHBOUND"
enabled = true
rows = 4
travel_minutes = 5
provider = "OpenLdbws"
from = "HRN"
to = "FPK"

[[departures]]
name = "TURNPIKE LANE"
enabled = true
rows = 4
travel_minutes = 15
provider = "Tfl"
stop_id = "940GZZLUTPN"

[providers.open_ldbws]
api_key = "your-raildata-consumer-key"
host_url = "https://api1.raildata.org.uk/1010-live-arrival-and-departure-boards-arr-and-dep1_1/LDBWS/api/20220120/GetArrDepBoardWithDetails"

[providers.tfl]
app_key = "your-tfl-app-key"
host_url = "https://api.tfl.gov.uk"

[location]
latitude = 51.5
longitude = -0.12
timezone = "Europe/London"

[file_store]
save_directory = "./output"

[cache]
directory = "./cache"

[display]
kind = "WaveshareEpd7in5V2"
dither = "None"
image_format = "Bmp"

[stale_data]
departures_max_age_minutes = 15
weather_max_age_minutes = 180

[limits]
source_timeout_seconds = 40
render_deadline_seconds = 120

[server]
bind = "[::]:8080"
directory = "served"
advertise = true
instance_name = "E-ink home display"
wake_delay_seconds = 30
stale_grace_seconds = 300
refresh_cooldown_seconds = 30
device_overdue_grace_seconds = 900

[schedule]
cron = ["*/10 * * * *"]
