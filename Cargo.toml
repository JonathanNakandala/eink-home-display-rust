[package]
name = "eink-home-display-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
axum = { version = "0.8", features = ["http1", "tokio", "macros"] }
utoipa = { version = "6", features = ["chrono", "axum_extras", "preserve_order"] }
utoipa-axum = "0.3"
async-trait = "0.1.81"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.15", features = ["toml"] }
derive-new = "0.7"
flate2 = "1.0"
handlebars = "6.0.0"
headless_chrome = { version = "1.0.22", features = ["fetch"] }
image = "0.25.2"
log = "0.4.22"
reqwest = { version = "0.13", features = ["json", "query", "rustls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.120"
serde_valid = { version = "3", features = ["toml"] }
tempfile = "3.10.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }
url = "2"
futures-util = "0.3"
trait-variant = "0.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
embedded-hal = "1.0.0"
schemars = "1"
toml = "1"
croner = "4.0.0"
humantime = "2.4.0"
mdns-sd = "0.21.4"
socket2 = { version = "0.6", features = ["all"] }
httpdate = "1.0.3"
secrecy = { version = "0.10.3", features = ["serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
sha2 = "0.11"
subtle = "2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs", "x509-parser"] }
x509-parser = { version = "0.18", features = ["verify-aws"] }
time = "0.3"
getrandom = "0.4.3"
base64 = "0.23.1"
rustls-pki-types = "1.15.1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
http-body-util = "0.1"
interprocess = { version = "2.4", features = ["tokio"] }
hyper-util = { version = "0.1.21", features = ["server", "http1", "tokio", "service"] }
arc-swap = "1.9.2"
yasna = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
httpmock = "0.8"
speculoos = "0.13"
cms = "0.2.3"
jsonschema = { version = "0.58", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = "0.5"
