# =============================================================================
# reTerminal E1003 - shows the image served by eink-home-display-rust
# =============================================================================
# Each wake: join Wi-Fi, download http://<server>:<port>/image, draw it, deep sleep.
# The server's address and port are found over mDNS and remembered across sleeps; the
# download only goes looking again when the remembered one stops working.
# The server side is `[server]` and `[display]` in the Rust app's config; keep
# `image_format` below in step with `display.image_format` there (the format can't be
# changed at run time, so a mismatch is only reported in the log).
#
# Requires ESPHome >= 2026.7.0 for the it8951 display platform.
# Hardware pins are taken from reference/esphome.yaml (Seeed's full example).
#
# Maintenance: hold the middle button (KEY1) while waking and the device stays
# awake instead of sleeping, so it can be updated over the air.
# =============================================================================
substitutions:
  device_name: reterminal-e1003
  friendly_name: "reTerminal_E1003"
  # The server is found over mDNS, so nothing here needs to change when its address or
  # port does. Used only until the first successful scan, or if a scan finds nothing:
  fallback_url: "http://e-ink-home-display.local:8080/image"
  # The path the Rust app serves the image at.
  image_path: /image
  # For the time shown when a download fails.
  timezone: Europe/London
  # Pick a server by the name a scan shows (the Rust app's server.instance_name).
  # Empty takes the first image server found.
  server_name: ""
  # BMP (8-bit, uncompressed, ~2.6 MB, no decoder needed) or PNG (small, needs inflating).
  image_format: BMP
  # Match the Rust app's refresh schedule, e.g. --cron "*/10 * * * *".
  sleep_duration: 10min
  # How long the panel needs to finish drawing before power is cut.
  refresh_settle: 15s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - eink_discovery.h
    - eink_notice.h
  on_boot:
    priority: -100
    then:
      # Battery measurement circuit
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - if:
          condition:
            binary_sensor.is_on: maintenance_button
          then:
            - logger.log: "Maintenance mode: staying awake"
            - deep_sleep.prevent: deep_sleep_1
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - script.execute: fetch_image

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf
    advanced:
      # Lets lwIP's resolver look up .local names (ESPHome's own mDNS only advertises).
      # Some versions default it off to save flash, so set it explicitly.
      enable_lwip_mdns_queries: true

# OPI PSRAM holds the decoded image and the 16-level framebuffer.
psram:
  mode: octal

# The CH340K USB bridge is on UART0, not the default USB_CDC.
logger:
  hardware_uart: UART0

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # A fixed address makes the connection quicker, which is battery life.
  # manual_ip:
  #   static_ip: 192.168.1.60
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  # Skip scanning for the strongest access point; use the first match.
  fast_connect: true

http_request:
  # Plain HTTP on the LAN; TLS would cost a lot of RAM for nothing.
  timeout: 20s
  watchdog_timeout: 40s

online_image:
  - id: dashboard
    url: ${fallback_url}
    format: ${image_format}
    type: GRAYSCALE
    update_interval: never
    # The panel is 1872x1404 and the image is rendered at that size, so no resize.
    on_download_finished:
      - logger.log: "Image downloaded, drawing"
      - component.update: epaper_display
      - delay: ${refresh_settle}
      - if:
          condition:
            binary_sensor.is_off: maintenance_button
          then:
            - deep_sleep.enter: deep_sleep_1
    on_error:
      # The remembered server may have moved: look once per wake, then try again.
      - if:
          condition:
            lambda: 'return !id(searched);'
          then:
            - script.execute: discover
            - if:
                condition:
                  lambda: 'return id(server_found);'
                then:
                  - script.execute: fetch_image
                else:
                  - script.execute: give_up
          else:
            - script.execute: give_up

globals:
  # The server found last time. Kept across deep sleep; 0 means none yet.
  - id: server_ip
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: server_port
    type: uint16_t
    restore_value: yes
    initial_value: '0'
  # This wake's state.
  - id: searched
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: server_found
    type: bool
    restore_value: no
    initial_value: 'false'
  # Draw the failure notice instead of the picture.
  - id: show_failure
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # Downloads from the remembered server, or the fallback URL before one has been found.
  - id: fetch_image
    then:
      - online_image.set_url:
          id: dashboard
          url: !lambda |-
            if (id(server_ip) == 0 || id(server_port) == 0)
              return "${fallback_url}";
            return eink_discovery::url(id(server_ip), id(server_port), "${image_path}");
      - component.update: dashboard

  # Asks the network where the server is, and remembers the answer.
  - id: discover
    then:
      - lambda: |-
          id(searched) = true;
          eink_discovery::Server server;
          id(server_found) = eink_discovery::find(server, "${server_name}");
          if (!id(server_found))
            return;
          id(server_ip) = server.ip;
          id(server_port) = server.port;
          if (!server.format.empty() && server.format != "${image_format}" && strcasecmp(server.format.c_str(), "${image_format}") != 0)
            ESP_LOGE("eink_discovery", "Server sends %s but this firmware decodes ${image_format}; set both to the same format", server.format.c_str());

  # Nothing worked: the picture stays on the panel (e-paper keeps it) apart from a notice in
  # the corner saying when it last failed. Tries again at the next wake.
  - id: give_up
    then:
      - logger.log: "Image download failed, showing notice"
      # The clock survives deep sleep; this just gives a fresh start a moment to sync.
      - if:
          condition:
            wifi.connected:
          then:
            - wait_until:
                condition:
                  time.has_time:
                timeout: 8s
      - lambda: 'id(show_failure) = true;'
      - component.update: epaper_display
      - delay: ${refresh_settle}
      - if:
          condition:
            binary_sensor.is_off: maintenance_button
          then:
            - deep_sleep.enter: deep_sleep_1

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

font:
  # The dashboard's own font, from the Rust app's templates; only the glyphs the notice needs.
  - file: ../templates/fonts/Overpass/Overpass-SemiBold.ttf
    id: notice_font
    size: 36
    glyphs: " :@0123456789Laustpdefi"

spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

display:
  - platform: it8951
    id: epaper_display
    spi_id: epaper_spi_bus
    model: seeed-reterminal-e1003
    update_interval: never
    grayscale: true
    # The Rust app already reduced the image to 16 greys (display.dither there).
    dithering: false
    update_mode: GC16
    transform:
      mirror_x: true
      mirror_y: false
    lambda: |-
      if (id(show_failure)) {
        // Only this corner is refreshed; the rest of the panel keeps its picture.
        auto now = id(sntp_time).now();
        eink_notice::draw(*id(epaper_display), id(notice_font),
                          now.is_valid() ? now.strftime("Last update failed @ %H:%M") : std::string("Last update failed"));
      } else {
        it.image(0, 0, id(dashboard));
      }

output:
  # Battery measurement enable
  - platform: gpio
    pin: GPIO40
    id: bsp_battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 60s
    filters:
      # Onboard 1:2 voltage divider
      - multiply: 2.0
  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

binary_sensor:
  # KEY1, the middle button: held at wake to stay awake for updates.
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT
      inverted: true
    id: maintenance_button
    internal: true

deep_sleep:
  id: deep_sleep_1
  # Safety net if the download or draw hangs; the normal exit is deep_sleep.enter above.
  run_duration: 120s
  sleep_duration: ${sleep_duration}
  # KEY0, the right green button, wakes it early for an immediate refresh.
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        mode: INPUT_PULLUP
    mode: ANY_LOW
