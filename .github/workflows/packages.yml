name: packages

on:
  pull_request:
    paths:
      - deploy/**
      - "!deploy/**/*.md"
      - src/main.rs
      - src/cli.rs
      - .github/scripts/build-packages.sh
      - .github/scripts/package-release.sh
      - .github/scripts/smoke-test.sh
      - .github/actions/install-nfpm/**
      - .github/actions/install-cargo-about/**
      - .github/scripts/third-party-licences.sh
      - .github/workflows/packages.yml
  # The release runs this first (release-please.yml), so a package that does not install is not attached to a release.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5
  # As the release is built, so what is tried is what is shipped.
  RUSTFLAGS: -C target-cpu=x86-64-v3

defaults:
  run:
    shell: bash

jobs:
  # Builds the program and the packages once, for the two jobs below to try.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --bin home-display-server --bin displayctl
      # What the release does with the build, in the same order: the program starts, then the archive and the packages are made.
      - run: bash .github/scripts/smoke-test.sh
      - uses: ./.github/actions/install-cargo-about
      - run: bash .github/scripts/third-party-licences.sh
      - uses: ./.github/actions/install-nfpm
      - run: bash .github/scripts/package-release.sh 0.0.0-test
      - run: bash .github/scripts/build-packages.sh 0.0.0-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          retention-days: 1

  # Installs the .deb on this machine, which is Ubuntu under systemd: the scripts run for real, and so does the service.
  deb:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: Install
        run: sudo apt-get install --yes ./home-display-server_*_amd64.deb
      - name: What was put where
        run: |
          id home-display
          test "$(sudo stat -c '%U:%G %a' /etc/home-display/config.toml)" = "root:home-display 640"
          test "$(sudo stat -c '%U:%G %a' /var/lib/home-display)" = "home-display:home-display 700"
          # The first install made the certificate authority, as the service's user.
          sudo test -f /var/lib/home-display/pki/root.key
          test -x /usr/bin/home-display-server && test -x /usr/bin/displayctl
          # The licences, which ask to go with every copy.
          test -s /usr/share/doc/home-display-server/THIRD_PARTY_LICENSES.txt
          test -s /usr/share/doc/home-display-server/INSTALL.md && test -s /usr/share/doc/home-display-server/README.md
          test -s /usr/share/doc/home-display-server/changelog.gz && test -s /usr/share/doc/home-display-server/copyright
          test -s /usr/share/doc/home-display-server/LICENSE-MIT && test -s /usr/share/doc/home-display-server/LICENSE-APACHE
          systemd-analyze verify /usr/lib/systemd/system/home-display.service /usr/lib/systemd/system/home-display-health.timer
      - name: Start it
        run: |
          sudo systemctl enable --now home-display home-display-health.timer
          for _ in $(seq 30); do
            curl --fail --silent http://127.0.0.1:8080/healthz && break
            sleep 2
          done
          echo
          systemctl is-active home-display
          journalctl -u home-display --no-pager | tail -n 20
      - name: Back up
        run: |
          # The unit itself, sandbox and all, which is what the timer runs: the sandbox is where it can go wrong.
          systemd-analyze verify /usr/lib/systemd/system/home-display-backup.service /usr/lib/systemd/system/home-display-backup.timer
          sudo systemctl start home-display-backup.service
          test "$(systemctl show home-display-backup.service -p Result --value)" = success
          # The folder is closed to everyone but root, so it takes root to look in it.
          archive=$(sudo bash -c 'ls /var/backups/home-display/home-display-*.tar.gz | head -n 1')
          sudo test -s "$archive" && sudo test -s "$archive.sha256"
          sudo home-display-restore --list "$archive" | grep -q 'pki/root.key$'
          sudo home-display-restore --list "$archive" | grep -q 'etc/home-display/config.toml$'
          test "$(sudo stat -c '%a %U' /etc/home-display/backup.env)" = "600 root"
          journalctl -u home-display-backup --no-pager | tail -n 5
      - name: The health check restarts a service that does not answer
        run: |
          # Pointed at a port where nothing listens, so /healthz does not answer. The unit is sandboxed (that is what is being tried),
          # and it restarts the service on the third failure in a row and not before.
          echo 'HEALTH_URL=http://127.0.0.1:9/healthz' | sudo tee /etc/home-display/health.env > /dev/null
          before=$(systemctl show home-display.service -p MainPID --value)
          sudo systemctl start home-display-health.service
          sudo systemctl start home-display-health.service
          test "$(systemctl show home-display.service -p MainPID --value)" = "$before"
          sudo systemctl start home-display-health.service
          test "$(systemctl show home-display.service -p MainPID --value)" != "$before"
          systemctl is-active home-display
          sudo rm /etc/home-display/health.env
      - name: Upgrade in place
        run: |
          # The same package again: the configuration and the authority stay, and the service is restarted.
          before=$(sudo sha256sum /var/lib/home-display/pki/root.key)
          sudo apt-get install --yes --reinstall ./home-display-server_*_amd64.deb
          test "$before" = "$(sudo sha256sum /var/lib/home-display/pki/root.key)"
          systemctl is-active home-display
      - name: Remove
        run: |
          sudo apt-get remove --yes home-display-server
          test ! -e /usr/bin/home-display-server
          if systemctl is-active --quiet home-display; then echo "the service is still running"; exit 1; fi
          # The data, the backups and the configuration are kept.
          sudo test -f /var/lib/home-display/pki/root.key
          sudo test -f /etc/home-display/config.toml
          sudo test -d /var/backups/home-display

  # Installs from the release archive, the way install.sh is meant to be used: unpacked, and run from where it is. First install, an
  # upgrade over it, and --uninstall, on this machine, which is Ubuntu under systemd.
  archive:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: Unpack
        run: |
          tar -xzf home-display-server-*-x86_64-v3-linux.tar.gz
          ls home-display-server-*-x86_64-v3-linux
      - name: First install
        run: |
          cd home-display-server-*-x86_64-v3-linux
          sudo ./install.sh
          id home-display
          test "$(sudo stat -c '%U:%G %a' /etc/home-display/config.toml)" = "root:home-display 640"
          sudo test -f /var/lib/home-display/pki/root.key
          for _ in $(seq 30); do curl --fail --silent http://127.0.0.1:8080/healthz && break; sleep 2; done
          echo
          systemctl is-active home-display home-display-health.timer home-display-backup.timer
          # The licences are in the archive, as they are asked to be.
          test -s THIRD_PARTY_LICENSES.txt && test -s LICENSE-MIT && test -s LICENSE-APACHE
      - name: Back up with the unit
        run: |
          sudo systemctl start home-display-backup.service
          test "$(systemctl show home-display-backup.service -p Result --value)" = success
      - name: Upgrade over it
        run: |
          cd home-display-server-*-x86_64-v3-linux
          echo '# my edit' | sudo tee -a /etc/home-display/config.toml > /dev/null
          before=$(sudo sha256sum /var/lib/home-display/pki/root.key)
          sudo ./install.sh
          # The configuration and the authority are the user's: neither is touched.
          sudo grep -q '# my edit' /etc/home-display/config.toml
          test "$before" = "$(sudo sha256sum /var/lib/home-display/pki/root.key)"
          systemctl is-active home-display
      - name: Uninstall
        run: |
          cd home-display-server-*-x86_64-v3-linux
          sudo ./install.sh --uninstall
          test ! -e /usr/local/bin/home-display-server
          test ! -e /etc/systemd/system/home-display.service
          if systemctl is-active --quiet home-display; then echo "the service is still running"; exit 1; fi
          # The data, the configuration and the backups stay.
          sudo test -f /var/lib/home-display/pki/root.key
          sudo test -f /etc/home-display/config.toml
          sudo test -d /var/backups/home-display

  # Installs the .rpm in Fedora. A container has no systemd running, so the service is not started: what is tried is the user, the
  # files, their owners, and the scripts, which must not need systemd running.
  rpm:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: Install in Fedora
        run: |
          docker run --rm --volume "$PWD:/packages:ro" fedora:latest bash -euxo pipefail -c '
            dnf install --assumeyes /packages/home-display-server-*.rpm
            id home-display
            test "$(stat -c "%U:%G %a" /etc/home-display/config.toml)" = "root:home-display 640"
            test "$(stat -c "%U:%G %a" /var/lib/home-display)" = "home-display:home-display 700"
            test -f /var/lib/home-display/pki/root.key
            test -x /usr/bin/home-display-server
            # The backup and the restore, which do not need systemd running (the timer does, and is tried on the Ubuntu one).
            home-display-backup
            archive=$(ls /var/backups/home-display/home-display-*.tar.gz | head -n 1)
            test -s "$archive.sha256"
            home-display-restore --list "$archive" | grep -q "pki/root.key$"
            test "$(stat -c "%a %U" /etc/home-display/backup.env)" = "600 root"
            rpm --verify home-display-server || true
            # The scripts on removal, which must not need a running systemd either.
            dnf remove --assumeyes home-display-server
            test ! -e /usr/bin/home-display-server
            test -f /var/lib/home-display/pki/root.key
          '
