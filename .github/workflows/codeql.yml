name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New queries are added to CodeQL, and are run against code that has not changed.
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write # to upload the results to code scanning
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # The server (rust), the firmware's C++ (c-cpp: its headers are read without being built, which finds less than a build would),
        # the page for a browser (javascript-typescript), the firmware's tools (python), and the workflows themselves (actions).
        language: [actions, c-cpp, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # Read as it is, with no build: none of these needs one, and Rust and C/C++ support it.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
